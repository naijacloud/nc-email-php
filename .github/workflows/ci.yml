name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow rather than repeating the matrix, so a tag
  # is verified by exactly the checks that guard main.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      # Every supported version is reported, rather than the run stopping at the
      # first failure — "8.1 broke" and "everything broke" need different fixes.
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
          # The suite spawns `php -S` as the mock API. Without this, a warning
          # printed to stderr by the child would be indistinguishable from a
          # real failure.
          ini-values: error_reporting=E_ALL, display_errors=On

      # Not --strict: it warns about the `version` field, which is kept here
      # deliberately so the package states its own version in one obvious place
      # alongside Naijamail::VERSION. Everything else --strict checks is caught
      # by the plain run.
      - name: Validate composer.json
        run: composer validate

      # No lock file is committed (this is a library), so the range in
      # composer.json is what actually gets resolved here. That is the point.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint every PHP file
        run: |
          find src tests examples -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Run the test suite
        run: vendor/bin/phpunit --colors=always
